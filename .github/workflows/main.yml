name: Проверка кода бота

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Скачать код
      uses: actions/checkout@v4
    
    - name: Установить Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Проверка файлов
      run: |
        echo "Checking files..."
        ls -la
        echo ""
        echo "Checking main.py..."
        if [ -f "main.py" ]; then echo "✅ main.py found!"; else echo "❌ main.py NOT found!"; exit 1; fi
        echo ""
        echo "Checking requirements.txt..."
        if [ -f "requirements.txt" ]; then echo "✅ requirements.txt found!"; else echo "❌ requirements.txt NOT found!"; exit 1; fi
    
    - name: Установка зависимостей
      run: |
        echo "Installing dependencies..."
        pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Проверка синтаксиса Python
      run: |
        echo "Checking Python syntax..."
        python -m py_compile main.py
        echo "✅ Syntax OK!"
    
    - name: Проверка импортов
      run: |
        echo "Checking aiogram import..."
        python -c "import aiogram; print('✅ aiogram version:', aiogram.__version__)"
        echo "✅ Imports OK!"
    
    - name: Проверка токена
      run: |
        if [ -n "${{ secrets.BOT_TOKEN }}" ]; then
          echo "✅ BOT_TOKEN is set!"
        else
          echo "⚠️ BOT_TOKEN is not set (this is OK for testing)"
        fi
    
    - name: Проверка структуры кода
      run: |
        echo "Checking code structure..."
        python -c "
import sys
with open('main.py', 'r', encoding='utf-8') as f:
    content = f.read()
required = [
    'def calculate_monthly_payment',
    'def generate_schedule',
    'def get_or_create_user',
    'def get_user_credits',
    'def get_total_debt',
    '@dp.message(Command(\"start\"))',
    '@dp.message(Command(\"add\"))',
    '@dp.message(Command(\"salary\"))',
    'class AddCreditStates',
    'class SalaryStates'
]
missing = []
for func in required:
    if func not in content:
        missing.append(func)
if missing:
    print('❌ Missing functions:', ', '.join(missing))
    sys.exit(1)
else:
    print('✅ All functions found!')
    print('✅ Code is ready for deployment!')
"
    
    - name: Итог проверки
      run: |
        echo ""
        echo "✅✅✅ ALL CHECKS PASSED! ✅✅✅"
        echo ""
        echo "Your bot is ready for deployment!"
